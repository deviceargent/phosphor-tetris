<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Tetris · Fósforo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.85; }
    94% { opacity: 1; }
  }
  body {
    background: #020403;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    color: #8fd98a;
    overflow: hidden;
    user-select: none;
  }
  .head { width: 100%; max-width: 280px; margin-bottom: 14px; }
  .head .kicker {
    font-size: 10px; letter-spacing: 0.25em; color: #5a9a56; margin-bottom: 4px;
  }
  h1 {
    margin: 0; font-size: 22px; letter-spacing: 0.04em; color: #c7ffc0;
    text-shadow: 0 0 10px rgba(57,255,20,0.4);
    animation: flicker 6s infinite;
  }
  .row { display: flex; gap: 16px; align-items: flex-start; }
  .stage {
    position: relative;
    border: 1px solid rgba(57,255,20,0.3);
    box-shadow: 0 0 24px rgba(57,255,20,0.08), inset 0 0 40px rgba(0,0,0,0.6);
    border-radius: 4px;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: multiply;
  }
  canvas { display: block; }
  .over {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(2,4,3,0.75);
    gap: 10px;
    z-index: 2;
  }
  .over.show { display: flex; }
  .over .go {
    color: #ff6b6b; font-size: 16px; letter-spacing: 0.15em;
    text-shadow: 0 0 10px rgba(255,107,107,0.6);
  }
  .over .ps { font-size: 11px; color: #8fd98a; }
  button.phosphor-btn {
    background: transparent;
    border: 1px solid rgba(57,255,20,0.35);
    color: #a8f0a2;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-transform: uppercase;
  }
  button.phosphor-btn:hover {
    background: rgba(57,255,20,0.1);
    border-color: rgba(57,255,20,0.7);
  }
  button.phosphor-btn.active {
    background: rgba(57,255,20,0.16);
    border-color: #39ff14;
    color: #d4ffcf;
    box-shadow: 0 0 8px rgba(57,255,20,0.35);
  }
  button:disabled { opacity: 0.4; cursor: default; }
  .panel {
    display: flex; flex-direction: column; gap: 14px; min-width: 130px;
  }
  .box {
    border: 1px solid rgba(57,255,20,0.2);
    padding: 10px 12px;
  }
  .box .lbl {
    font-size: 9px; color: #3d6e3a; letter-spacing: 0.15em; margin-bottom: 4px;
  }
  #score { font-size: 18px; color: #c7ffc0; }
  #lines, #level { font-size: 14px; color: #8fd98a; }
  #nextType { font-size: 12px; }
  .box.mt .lbl { margin-bottom: 6px; }
  .help {
    max-width: 280px; font-size: 10px; color: #3d6e3a; margin-top: 16px;
    line-height: 1.6; letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="kicker">BLOQUES · FÓSFORO</div>
    <h1>TETRIS</h1>
  </div>

  <div class="row">
    <div class="stage">
      <canvas id="cv" width="280" height="560"></canvas>
      <div class="over" id="over">
        <div class="go">FIN DE PARTIDA</div>
        <div class="ps" id="finalScore"></div>
        <button id="retryBtn" class="phosphor-btn active">&#10226; REINTENTAR</button>
      </div>
    </div>

    <div class="panel">
      <div class="box"><div class="lbl">PUNTAJE</div><div id="score">0</div></div>
      <div class="box"><div class="lbl">LÍNEAS</div><div id="lines">0</div></div>
      <div class="box"><div class="lbl">NIVEL</div><div id="level">1</div></div>
      <div class="box mt"><div class="lbl">SIGUIENTE</div><div id="nextType"></div></div>
      <button id="pauseBtn" class="phosphor-btn">&#10074;&#10074; PAUSA</button>
    </div>
  </div>

  <div class="help">&larr; &rarr; mover · &darr; bajar · &uarr; rotar · ESPACIO caída instantánea</div>

<script>
const COLS = 10, ROWS = 20, CELL = 28;
const W = COLS * CELL, H = ROWS * CELL;
const DROP_MS_BASE = 800, DROP_MS_MIN = 90;

const SHAPES = {
  I: { color: "#33e1ff", glow: "rgba(51,225,255,0.9)", cells: [[0,1],[1,1],[2,1],[3,1]] },
  O: { color: "#ffb000", glow: "rgba(255,176,0,0.9)", cells: [[1,0],[2,0],[1,1],[2,1]] },
  T: { color: "#ff3ec8", glow: "rgba(255,62,200,0.9)", cells: [[1,0],[0,1],[1,1],[2,1]] },
  S: { color: "#8fd98a", glow: "rgba(143,217,138,0.9)", cells: [[1,0],[2,0],[0,1],[1,1]] },
  Z: { color: "#ff5b3d", glow: "rgba(255,91,61,0.9)", cells: [[0,0],[1,0],[1,1],[2,1]] },
  J: { color: "#9d7bff", glow: "rgba(157,123,255,0.9)", cells: [[0,0],[0,1],[1,1],[2,1]] },
  L: { color: "#fff2e0", glow: "rgba(255,242,224,0.9)", cells: [[2,0],[0,1],[1,1],[2,1]] },
};
const TYPES = Object.keys(SHAPES);

function rotateCells(cells) {
  return cells.map(([x, y]) => [3 - y, x]);
}
function newPiece(type) {
  const t = type || TYPES[Math.floor(Math.random() * TYPES.length)];
  return { type: t, cells: SHAPES[t].cells.map(c => [...c]), x: 3, y: -1 };
}
function emptyGrid() {
  return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
}

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
ctx.fillStyle = "#05090a";
ctx.fillRect(0, 0, W, H);

const $score = document.getElementById("score");
const $lines = document.getElementById("lines");
const $level = document.getElementById("level");
const $nextType = document.getElementById("nextType");
const $over = document.getElementById("over");
const $finalScore = document.getElementById("finalScore");
const $pauseBtn = document.getElementById("pauseBtn");
const $retryBtn = document.getElementById("retryBtn");

let grid, piece, next, lastDrop, over, running, score, linesCleared, level;

function reset() {
  grid = emptyGrid();
  piece = newPiece();
  next = newPiece();
  lastDrop = performance.now();
  over = false;
  running = true;
  score = 0; linesCleared = 0; level = 1;
  $score.textContent = "0";
  $lines.textContent = "0";
  $level.textContent = "1";
  updateNext();
  $over.classList.remove("show");
  $pauseBtn.disabled = false;
  setPauseLabel();
}

function updateNext() {
  const s = SHAPES[next.type];
  $nextType.textContent = "\u25CF " + next.type;
  $nextType.style.color = s.color;
  $nextType.style.textShadow = "0 0 8px " + s.glow;
}

function collides(p, dx, dy, cells) {
  const test = cells || p.cells;
  for (const [cx, cy] of test) {
    const x = p.x + cx + dx;
    const y = p.y + cy + dy;
    if (x < 0 || x >= COLS || y >= ROWS) return true;
    if (y >= 0 && grid[y][x]) return true;
  }
  return false;
}

function lockPiece() {
  for (const [cx, cy] of piece.cells) {
    const x = piece.x + cx, y = piece.y + cy;
    if (y < 0) { over = true; return; }
    grid[y][x] = SHAPES[piece.type].color;
  }
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) {
    if (grid[y].every(c => c)) {
      grid.splice(y, 1);
      grid.unshift(Array(COLS).fill(null));
      cleared++;
      y++;
    }
  }
  if (cleared > 0) {
    linesCleared += cleared;
    level = 1 + Math.floor(linesCleared / 8);
    $lines.textContent = String(linesCleared);
    $level.textContent = String(level);
    const points = [0, 100, 300, 500, 800][cleared] || 0;
    score += points * level;
    $score.textContent = String(score);
  }
  piece = next;
  next = newPiece();
  updateNext();
  if (collides(piece, 0, 0)) over = true;
}

function move(dx, dy) {
  if (over || !running) return false;
  if (!collides(piece, dx, dy)) {
    piece.x += dx; piece.y += dy;
    return true;
  }
  return false;
}

function rotate() {
  if (over || !running) return;
  const rotated = rotateCells(piece.cells);
  for (const k of [0, -1, 1, -2, 2]) {
    if (!collides(piece, k, 0, rotated)) {
      piece.cells = rotated;
      piece.x += k;
      return;
    }
  }
}

function hardDrop() {
  if (over || !running) return;
  let dy = 0;
  while (!collides(piece, 0, dy + 1)) dy++;
  piece.y += dy;
  lockPiece();
  lastDrop = performance.now();
}

function drawGridLines() {
  ctx.strokeStyle = "rgba(57,255,20,0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, H); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(W, y * CELL); ctx.stroke();
  }
}

function drawCell(cx, cy, color, glow) {
  const px = cx * CELL, py = cy * CELL;
  ctx.save();
  ctx.shadowColor = glow;
  ctx.shadowBlur = 10;
  ctx.fillStyle = color;
  ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
  ctx.restore();
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.strokeRect(px + 2, py + 2, CELL - 4, CELL - 4);
}

function frame(t) {
  const dropMs = Math.max(DROP_MS_MIN, DROP_MS_BASE - (level - 1) * 60);

  if (running && !over) {
    if (t - lastDrop > dropMs) {
      if (!move(0, 1)) lockPiece();
      lastDrop = t;
    }
  }
  if (over) {
    running = false;
    $finalScore.textContent = "PUNTAJE: " + score;
    $over.classList.add("show");
  }

  // Persistencia de fósforo
  ctx.fillStyle = "rgba(5,9,10,0.35)";
  ctx.fillRect(0, 0, W, H);
  drawGridLines();

  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const c = grid[y][x];
      if (c) drawCell(x, y, c, c);
    }

  if (!over) {
    const shape = SHAPES[piece.type];
    for (const [cx, cy] of piece.cells) {
      const gx = piece.x + cx, gy = piece.y + cy;
      if (gy >= 0) drawCell(gx, gy, shape.color, shape.glow);
    }
  }

  requestAnimationFrame(frame);
}

function setPauseLabel() {
  $pauseBtn.innerHTML = running ? "&#10074;&#10074; PAUSA" : "&#9654; CORRER";
}

window.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowDown","ArrowUp"," "].includes(e.key)) e.preventDefault();
  if (e.key === "ArrowLeft") move(-1, 0);
  else if (e.key === "ArrowRight") move(1, 0);
  else if (e.key === "ArrowDown") move(0, 1);
  else if (e.key === "ArrowUp") rotate();
  else if (e.key === " ") hardDrop();
});

$pauseBtn.addEventListener("click", () => {
  if (over) return;
  running = !running;
  setPauseLabel();
});
$retryBtn.addEventListener("click", () => {
  reset();
});
document.addEventListener("contextmenu", e => e.preventDefault());

reset();
requestAnimationFrame(frame);
</script>
</body>
</html>
