[package]
name = "phosphor-tetris"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "phosphor-tetris"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
